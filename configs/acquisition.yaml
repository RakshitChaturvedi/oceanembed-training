dates:
  start: "2021-01-01"
  end: "2024-12-31"

domain:
  lat_min: 5.0
  lat_max: 30.0
  lon_min: 45.0
  lon_max: 105.0

output_root: "data/raw"

copernicus:
  glorys:
    dataset_id: "cmems_mod_glo_phy_my_0.083deg_P1D-m"
    variables: ["thetao", "so"]
    output_dir: "data/raw/glorys"

  armor3d:
    dataset_id: "cmems_obs-mob_glo_phy_my_0.125deg_P1D-m"
    variables: ["to", "so"]
    output_dir: "data/raw/armor3d"

  ssh:
    product_id: "SEALEVEL_GLO_PHY_L4_MY_008_047"
    preferred_variables: ["sla", "zos", "sea_level_anomaly"]
    output_dir: "data/raw/ssh"

podaac:
  sst:
    collection: "AVHRR_OI-NCEI-L4-GLOB-v2.1"
    output_dir: "data/raw/sst"

  sss:
    collection: "OISSS_L4_multimission_7day_v2"
    output_dir: "data/raw/sss"

  wind:
    collection: "CCMP_WINDS_10M6HR_L4_V3.1"
    output_dir: "data/raw/wind"

  currents:
    collection: "OSCAR_L4_OC_FINAL_V2.0"
    output_dir: "data/raw/currents"

argo:
  # INCOIS LAS is required by the primer, but its current LAS UI does not expose
  # a stable machine endpoint that we can safely hard-code.
  # Put the NetCDF download URL exported/generated by the INCOIS LAS UI here.
  enabled: true
  download_url: "https://las.incois.gov.in/las/UI.vm#panelHeaderHidden=false;differences=false;autoContour=false;xCATID=8DD38C89BD3EA9C1B7B84D5F47EE9E60;xDSID=id-d272905813;varid=SST-id-d272905813;imageSize=auto;over=xy;compute=Nonetoken;tlo=24-Jan-1980%2000:00;thi=24-Jan-1980%2000:00;catid=8DD38C89BD3EA9C1B7B84D5F47EE9E60;dsid=id-d272905813;varid=SST-id-d272905813;avarcount=0;xlo=30;xhi=120;ylo=-29.996871948242;yhi=29.977840423584;operation_id=Plot_2D_XY_zoom;view=xy:~:text=https%3A//las.incois,Plot_2D_XY_zoom%3Bview%3Dxy"
  output_path: "data/raw/argo/incois_gridded_argo.nc"

oscar:
  enabled: true
  collection: "OSCAR_L4_OC_FINAL_V2.0"
  output_dir: "data/raw/currents"

optional:
  tchp_26c_climatology:
    enabled: false
    url: ""
    output_dir: "data/raw/tchp_reference"